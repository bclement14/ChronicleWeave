[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicleweave"
version = "1.1.0"
description = "A modular audio processing pipeline for chunking, transcribing with WhisperX, and producing readable scripts."
authors = [{ name = "Benjamin CLEMENT", email = "benji.usable@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["whisperx", "transcription", "audio", "pipeline", "speech-recognition", "srt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pydub>=0.25.1",
    "srt>=3.5.2",
    "tqdm>=4.64.1",
    "numpy>=1.20.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "audioop-lts; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chronicleweave = "chronicleweave.cli:main"
chronicleweave-batch = "chronicleweave.cli:batch_main"

[tool.setuptools.packages.find]
include = ["chronicleweave*"]

[tool.setuptools.package-data]
chronicleweave = ["modules/prompts/**/*"]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that exercise the full pipeline (~30s each).",
]
